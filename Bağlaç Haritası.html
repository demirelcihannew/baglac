<style>
/* Düzen: anlam ailesi blokları; her blok içinde tür kartları (bağlaç / edat / cümle zarfı / ikili) yan yana, dar ekranda alt alta */
:root{
  --paper:#f0f2f6; --surface:#ffffff; --sunk:#e7eaf1;
  --ink:#141a27; --muted:#5d6782; --rule:#d5dae5;
  --act:#1d2740; --on-act:#ffffff;
  --baglac:#2a46c4; --baglac-bg:#e5e9ff;
  --edat:#a85209;  --edat-bg:#fbeedc;
  --zarf:#0a6f62;  --zarf-bg:#dbf0ec;
  --ikili:#79348f; --ikili-bg:#f3e5fa;
  --ok:#1f6b45; --ok-bg:#def0e6;
  --no:#a62f22; --no-bg:#fae5e1;
  --disp:"Fraunces",Georgia,serif;
  --body:"Libre Franklin","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0d1118; --surface:#161b25; --sunk:#1e2533;
  --ink:#e6eaf2; --muted:#98a3bb; --rule:#2a3243;
  --act:#dfe5f2; --on-act:#111725;
  --baglac:#93a6ff; --baglac-bg:#1a2049;
  --edat:#eba763;  --edat-bg:#372512;
  --zarf:#4fc3b0;  --zarf-bg:#0d2f2b;
  --ikili:#cb93e6; --ikili-bg:#2b1a38;
  --ok:#5fc08c; --ok-bg:#132c1f;
  --no:#ef8f7e; --no-bg:#321915;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0d1118; --surface:#161b25; --sunk:#1e2533;
  --ink:#e6eaf2; --muted:#98a3bb; --rule:#2a3243;
  --act:#dfe5f2; --on-act:#111725;
  --baglac:#93a6ff; --baglac-bg:#1a2049;
  --edat:#eba763;  --edat-bg:#372512;
  --zarf:#4fc3b0;  --zarf-bg:#0d2f2b;
  --ikili:#cb93e6; --ikili-bg:#2b1a38;
  --ok:#5fc08c; --ok-bg:#132c1f;
  --no:#ef8f7e; --no-bg:#321915;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--act);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:0 60px}

/* başlık */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:11px 0}
.brand{display:flex;align-items:baseline;gap:12px;justify-content:space-between;flex-wrap:wrap}
h1{font-family:var(--disp);font-size:1.4rem;font-weight:600;margin:0;letter-spacing:-.015em}
.count{font-family:var(--mono);font-size:.7rem;color:var(--muted);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;margin-top:9px}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:7px 13px 9px;color:var(--muted);font-size:.87rem;font-weight:500;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--act)}

/* tür rozetleri */
.t{font-family:var(--mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:3px;white-space:nowrap;font-weight:500}
.t-baglac{color:var(--baglac);background:var(--baglac-bg)}
.t-edat{color:var(--edat);background:var(--edat-bg)}
.t-zarf{color:var(--zarf);background:var(--zarf-bg)}
.t-ikili{color:var(--ikili);background:var(--ikili-bg)}

/* kural kartı */
.rules{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:18px;margin-top:20px}
.rules h2{font-family:var(--disp);font-size:1.08rem;font-weight:600;margin:0 0 4px}
.rules .sub{color:var(--muted);font-size:.84rem;margin:0 0 14px}
.rul{display:grid;grid-template-columns:auto 1fr;gap:9px 12px;align-items:start}
.rul .q{font-size:.86rem;padding-top:1px}
.rul .a{display:flex;flex-direction:column;gap:2px;min-width:0}
.rul code{font-family:var(--mono);font-size:.76rem;color:var(--muted);word-break:break-word}
.rul .line{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.arrow{color:var(--muted)}

/* aile filtresi */
.filters{display:flex;gap:5px;flex-wrap:wrap;margin:22px 0 14px}
.fchip{border:1px solid var(--rule);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:.78rem;color:var(--muted)}
.fchip[aria-pressed="true"]{background:var(--act);border-color:var(--act);color:var(--on-act)}

/* aile bloğu */
.fam{margin-bottom:30px}
.fam-hd{display:flex;align-items:baseline;gap:10px;padding-bottom:7px;border-bottom:2px solid var(--ink);margin-bottom:13px;flex-wrap:wrap}
.fam-hd h3{font-family:var(--disp);font-size:1.22rem;font-weight:600;margin:0;letter-spacing:-.01em}
.fam-hd .gl{color:var(--muted);font-size:.82rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(246px,1fr));gap:11px}
.g{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:13px 14px;border-top:3px solid var(--rule);min-width:0;display:flex;flex-direction:column;gap:7px}
.g.k-baglac{border-top-color:var(--baglac)}
.g.k-edat{border-top-color:var(--edat)}
.g.k-zarf{border-top-color:var(--zarf)}
.g.k-ikili{border-top-color:var(--ikili)}
.g.starred{box-shadow:inset 3px 0 0 var(--edat)}
.g-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.star{background:none;border:0;padding:1px 3px;color:var(--rule);font-size:.95rem;line-height:1}
.star[aria-pressed="true"]{color:var(--edat)}
.forms{display:flex;flex-wrap:wrap;gap:4px}
.f{font-family:var(--disp);font-size:1rem;font-weight:600;background:var(--sunk);border-radius:5px;padding:1px 7px;line-height:1.45}
.g .ttl{font-family:var(--disp);font-size:1.02rem;font-weight:600;line-height:1.3}
.g .mean{font-size:.88rem}
.pat{font-family:var(--mono);font-size:.72rem;color:var(--muted);background:var(--sunk);border-radius:4px;padding:3px 7px;align-self:flex-start;max-width:100%;overflow-x:auto;white-space:nowrap}
.ex{border-left:2px solid var(--rule);padding-left:10px;font-size:.87rem}
.ex b{font-weight:600}
.ex .en b{padding:0 1px;border-bottom:2px solid currentColor}
.ex .tn{color:var(--muted);font-size:.82rem;margin-top:1px}
.note{font-size:.81rem;color:var(--muted);border-top:1px dotted var(--rule);padding-top:7px}
.note strong{color:var(--ink);font-weight:600}

/* alıştırma */
.sect{margin-top:22px}
.lead{color:var(--muted);font-size:.85rem;margin:0 0 15px;max-width:60ch}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.pick{text-align:left;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:4px}
.pick:hover{border-color:var(--act)}
.pick b{font-family:var(--disp);font-size:1.02rem;font-weight:600}
.pick span{font-size:.82rem;color:var(--muted)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.btn{border:1px solid var(--rule);background:var(--surface);border-radius:7px;padding:7px 13px;font-size:.84rem}
.btn.go{background:var(--act);border-color:var(--act);color:var(--on-act)}
.num{font-family:var(--mono);font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums}
.q{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:18px}
.qk{font-family:var(--mono);font-size:.62rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.qt{font-family:var(--disp);font-size:1.14rem;line-height:1.5;margin:9px 0 16px;text-wrap:balance}
.qt .blank{font-family:var(--mono);color:var(--act);letter-spacing:-.04em}
.qt .hi{background:var(--sunk);border-radius:4px;padding:0 5px}
.opts{display:flex;flex-direction:column;gap:7px}
.o{text-align:left;border:1px solid var(--rule);background:var(--sunk);border-radius:8px;padding:9px 12px;font-size:.93rem;display:flex;gap:9px;align-items:baseline}
.o .k{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.o:hover:not(:disabled){border-color:var(--act)}
.o.right{background:var(--ok-bg);border-color:var(--ok)}
.o.wrong{background:var(--no-bg);border-color:var(--no)}
.o:disabled{cursor:default}
.fb{margin-top:15px;padding-top:13px;border-top:1px solid var(--rule);font-size:.88rem;display:flex;flex-direction:column;gap:8px}
.fb .vd{font-weight:600}
.fb .vd.r{color:var(--ok)} .fb .vd.w{color:var(--no)}
.score{text-align:center;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:30px 18px}
.score .n{font-family:var(--disp);font-size:2.9rem;line-height:1;font-variant-numeric:tabular-nums}
.missed{margin-top:18px;text-align:left;display:flex;flex-direction:column;gap:7px}
.mrow{display:flex;justify-content:space-between;gap:10px;font-size:.87rem;border-bottom:1px dotted var(--rule);padding-bottom:6px;flex-wrap:wrap}
.mrow span{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:44px 16px;font-size:.9rem;max-width:46ch;margin:0 auto}
footer{margin-top:36px;padding-top:15px;border-top:1px solid var(--rule);color:var(--muted);font-size:.78rem}
</style>

/* ---- türetilmiş veri ---- */
FAM.forEach(f=>f.groups.forEach((g,i)=>{g.id=f.id+"-"+i;g.fam=f;}));
const GR=FAM.flatMap(f=>f.groups);
const FORMS=GR.flatMap(g=>g.forms.map(f=>({f,g})));
const KEY="baglac-haritasi-v1";
let star={};
try{star=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){star={}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(star))}catch(e){}};

const TABS=[{id:"harita",t:"Harita"},{id:"alistirma",t:"Alıştırma"},{id:"zor",t:"Zorlarım"}];
let tab="harita", fFilter="all", quiz=null;

const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const mark=s=>esc(s).replace(/\{\{(.+?)\}\}/g,"<b>$1</b>");
const bare=s=>s.replace(/\{\{(.+?)\}\}/g,"$1");
const hit=s=>(s.match(/\{\{(.+?)\}\}/)||[,""])[1];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=0|Math.random()*(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>shuffle(a).slice(0,n);
const cap=(s,like)=>/^[A-Z]/.test(like)?s.charAt(0).toUpperCase()+s.slice(1):s.charAt(0).toLowerCase()+s.slice(1);
const safe=f=>!AMBIG.has(f.toLowerCase());

/* ---- iskelet ---- */
function chrome(){
  document.getElementById("tabs").innerHTML=TABS.map(t=>
    `<button class="tab" role="tab" data-tab="${t.id}" aria-selected="${t.id===tab}">${t.t}</button>`).join("");
  const s=Object.keys(star).filter(k=>star[k]).length;
  document.getElementById("count").textContent=`${FORMS.length} yapı · ${FAM.length} anlam ailesi · ${s} işaretli`;
}

/* ---- harita ---- */
function card(g){
  const st=!!star[g.id];
  return `<article class="g k-${g.ty} ${st?"starred":""}">
    <div class="g-top"><span class="t t-${g.ty}">${T[g.ty].lb}</span>
      <button class="star" data-star="${g.id}" aria-pressed="${st}" title="Zor olarak işaretle">★</button></div>
    ${g.ttl?`<div class="ttl">${esc(g.ttl)}</div>`:""}
    ${(!g.ttl||g.forms.length>1)?`<div class="forms">${g.forms.map(f=>`<span class="f">${esc(f)}</span>`).join("")}</div>`:""}
    <div class="mean">${esc(g.mean)}</div>
    <div class="pat">${esc(g.pat)}</div>
    <div class="ex"><div class="en">${mark(g.ex.en)}</div><div class="tn">${esc(g.ex.tr)}</div></div>
    <div class="note">${g.note}</div>
  </article>`;
}
function viewHarita(){
  const fams=fFilter==="all"?FAM:FAM.filter(f=>f.id===fFilter);
  return `<div class="rules">
    <h2>Tek soru her şeyi çözer: arkasında ne var?</h2>
    <p class="sub">Bu konuda anlamı bilmek yetmez. Sınav, yapının <b>ardından ne gelebildiğini</b> sorar.</p>
    <div class="rul">
      <div class="q">Özne + fiil</div><div class="a"><div class="line"><span class="arrow">→</span><span class="t t-baglac">Bağlaç</span></div><code>Although it rained, we went out.</code></div>
      <div class="q">İsim / V-ing</div><div class="a"><div class="line"><span class="arrow">→</span><span class="t t-edat">Edat</span></div><code>Despite the rain, we went out.</code></div>
      <div class="q">Ayrı cümle</div><div class="a"><div class="line"><span class="arrow">→</span><span class="t t-zarf">Cümle zarfı</span></div><code>It rained; however, we went out.</code></div>
      <div class="q">İki parça</div><div class="a"><div class="line"><span class="arrow">→</span><span class="t t-ikili">İkili yapı</span></div><code>not only ... but also ...</code></div>
    </div></div>
  <div class="filters">
    <button class="fchip" data-f="all" aria-pressed="${fFilter==="all"}">Tümü</button>
    ${FAM.map(f=>`<button class="fchip" data-f="${f.id}" aria-pressed="${fFilter===f.id}">${esc(f.name)}</button>`).join("")}
  </div>
  ${fams.map(f=>`<section class="fam">
    <div class="fam-hd"><h3>${esc(f.name)}</h3><span class="gl">${esc(f.gl)}</span></div>
    <div class="grid">${f.groups.map(card).join("")}</div></section>`).join("")}`;
}
function viewZor(){
  const gs=GR.filter(g=>star[g.id]);
  if(!gs.length) return `<div class="empty">Henüz işaret yok. Haritada zorlandığın kartların sağ üstündeki ★ düğmesine bas; burada toplansınlar ve sadece onlardan alıştırma çözebil.</div>`;
  return `<div class="sect"><p class="lead">${gs.length} yapı işaretli. Alıştırma sekmesinde “sadece işaretlilerden” seçeneğini kullanabilirsin.</p>
    <div class="grid">${gs.map(card).join("")}</div></div>`;
}

/* ---- soru üretimi ---- */
function poolForms(exclFam,ty){
  return FORMS.filter(x=>x.g.fam.id!==exclFam.id&&safe(x.f)&&(!ty||x.g.ty===ty)).map(x=>x.f);
}
function qTur(src){
  const {f,g}=src;
  const opts=shuffle(Object.keys(T).map(k=>T[k].lb));
  return {kind:"Tür",text:`<span class="hi">${esc(f)}</span> hangi türdendir?`,opts,ans:T[g.ty].lb,g,f};
}
function qDonusum(src){
  const {f,g}=src, fam=g.fam;
  if(!g.sn) return null;
  /* yalnızca aynı anlam etiketini (sn) taşıyan gruplar arasında dönüşüm sorulur */
  const others=fam.groups.filter(x=>x.sn===g.sn&&x.ty!==g.ty);
  if(!others.length) return null;
  const to=pick(others,1)[0];
  const ans=pick(to.forms.filter(safe),1)[0];
  if(!ans) return null;
  const d=pick([...new Set(poolForms(fam,to.ty))],3);
  if(d.length<3) return null;
  return {kind:"Dönüşüm",text:`<span class="hi">${esc(f)}</span> bir <b>${T[g.ty].lb.toLowerCase()}</b>: ardından ${esc(T[g.ty].pat)} gelir.<br>Aynı cümleyi <b>${T[to.ty].lb.toLowerCase()}</b> ile kurmak istesen (“${esc(to.mean)}”) hangisini kullanırsın?`,
   opts:shuffle([ans,...d]),ans,g:to,f:ans,from:g};
}
function qBosluk(g){
  const a=hit(g.ex.en); if(!a) return null;
  const banned=new Set(g.fam.groups.flatMap(x=>x.forms.map(s=>s.toLowerCase())));
  const same=g.fam.groups.filter(x=>x.ty!==g.ty).flatMap(x=>x.forms).filter(safe);
  const out=FORMS.filter(x=>x.g.fam.id!==g.fam.id&&safe(x.f)&&!banned.has(x.f.toLowerCase())).map(x=>x.f);
  let d=[...pick(same,1),...pick([...new Set(out)],3)];
  d=[...new Set(d.map(s=>s.toLowerCase()))].map(s=>out.concat(same).find(o=>o.toLowerCase()===s)).slice(0,3);
  if(d.length<3) return null;
  const opts=shuffle([a,...d.map(x=>cap(x,a))]);
  return {kind:"Boşluk doldurma",text:esc(g.ex.en).replace(/\{\{.+?\}\}/,'<span class="blank">______</span>'),opts,ans:a,g,f:a,tr:g.ex.tr};
}
function build(kind,n,onlyStar){
  let src=FORMS, grps=GR;
  if(onlyStar){src=FORMS.filter(x=>star[x.g.id]);grps=GR.filter(g=>star[g.id]);}
  if(!src.length) return null;
  const mk=f=>a=>{const o=[];a.forEach(x=>{const q=f(x);if(q)o.push(q)});return o};
  const bucket={tur:mk(qTur)(src),donusum:mk(qDonusum)(src),bosluk:mk(qBosluk)(grps)};
  let qs;
  if(kind==="karisik"){
    /* üç soru tipinden eşit pay al, eksik kalanı diğerlerinden tamamla */
    const keys=["bosluk","donusum","tur"], share=Math.ceil(n/3);
    qs=keys.flatMap(k=>pick(bucket[k],share));
    if(qs.length<n) qs=qs.concat(shuffle(keys.flatMap(k=>bucket[k])).filter(q=>!qs.includes(q)));
  } else qs=bucket[kind]||[];
  if(!qs.length) return null;
  return {qs:shuffle(qs).slice(0,n),i:0,score:0,miss:[],sel:null};
}

/* ---- alıştırma ---- */
const KINDS=[{k:"bosluk",t:"Boşluk doldurma",d:"Gerçek sınav sorusu. Cümleye hangi yapının uyduğunu bul."},
 {k:"tur",t:"Tür tanıma",d:"Bağlaç mı, edat mı, cümle zarfı mı? En hızlı kazanç burada."},
 {k:"donusum",t:"Tür dönüşümü",d:"“although” bağlacının edat karşılığı ne? Asıl sınanan beceri."},
 {k:"karisik",t:"Karışık",d:"Üç tip soru birlikte gelir."}];
let onlyStar=false;
function viewAl(){
  if(!quiz){
    const sc=Object.keys(star).filter(k=>star[k]).length;
    return `<div class="sect">
      <p class="lead">Sorular haritadaki ${FORMS.length} yapıdan otomatik üretilir; her yanıttan sonra kuralı ve örneği birlikte görürsün.</p>
      <div class="bar"><button class="btn ${onlyStar?"go":""}" id="os" aria-pressed="${onlyStar}">${onlyStar?"✓ ":""}Sadece işaretlediklerim (${sc})</button></div>
      <div class="picks">${KINDS.map(k=>`<button class="pick" data-k="${k.k}"><b>${k.t}</b><span>${k.d}</span></button>`).join("")}</div>
      <div class="bar" style="margin:16px 0 0"><span class="num">Soru sayısı</span>
        <button class="btn" data-n="10" aria-pressed="${N===10}">10</button>
        <button class="btn" data-n="20" aria-pressed="${N===20}">20</button>
        <button class="btn" data-n="40" aria-pressed="${N===40}">40</button>
        <span class="num">seçili: ${N}</span></div></div>`;
  }
  if(quiz.i>=quiz.qs.length){
    const p=Math.round(quiz.score/quiz.qs.length*100);
    const ids=[...new Set(quiz.miss)];
    return `<div class="sect"><div class="score">
      <div class="n">${quiz.score}/${quiz.qs.length}</div>
      <p class="lead" style="margin:9px auto 0">%${p} doğru</p>
      ${ids.length?`<div class="missed">${ids.map(id=>{const g=GR.find(x=>x.id===id);
        return `<div class="mrow"><b>${esc(g.ttl||g.forms[0])}</b><span>${esc(g.fam.name)} · ${T[g.ty].lb}</span></div>`}).join("")}</div>
      <div class="bar" style="margin-top:17px;justify-content:center"><button class="btn" id="markmiss">Yanlışları ★ işaretle</button><button class="btn go" id="again">Yeniden</button></div>`
      :`<div class="bar" style="margin-top:15px;justify-content:center"><button class="btn go" id="again">Yeniden</button></div>`}
    </div></div>`;
  }
  const q=quiz.qs[quiz.i], s=quiz.sel, g=q.g;
  return `<div class="sect">
    <div class="bar"><span class="num">Soru ${quiz.i+1} / ${quiz.qs.length}</span>
      <span class="num" style="margin-left:auto">Doğru ${quiz.score}</span>
      <button class="btn" id="quit">Bitir</button></div>
    <div class="q">
      <div class="qk">${q.kind}</div>
      <div class="qt">${q.text}</div>
      <div class="opts">${q.opts.map((o,k)=>{
        let c="";
        if(s!==null){ if(o===q.ans)c=" right"; else if(o===s)c=" wrong"; }
        return `<button class="o${c}" data-o="${esc(o)}" ${s!==null?"disabled":""}><span class="k">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`}).join("")}</div>
      ${s!==null?`<div class="fb">
        <div class="vd ${s===q.ans?"r":"w"}">${s===q.ans?"Doğru":"Yanlış — doğrusu: "+esc(q.ans)}</div>
        <div><span class="t t-${g.ty}">${T[g.ty].lb}</span> <span class="num">${esc(T[g.ty].pat)}</span></div>
        <div class="pat">${esc(g.pat)}</div>
        <div class="ex"><div class="en">${mark(g.ex.en)}</div><div class="tn">${esc(g.ex.tr)}</div></div>
        <div class="note">${g.note}</div>
        <div class="bar" style="margin:4px 0 0"><button class="btn go" id="nq">${quiz.i===quiz.qs.length-1?"Sonucu gör":"Sonraki"}</button>
        <button class="btn" data-star="${g.id}" aria-pressed="${!!star[g.id]}">${star[g.id]?"★ işaretli":"★ zor"}</button></div>
      </div>`:""}
    </div></div>`;
}
let N=20;

function render(){
  chrome();
  document.getElementById("view").innerHTML = tab==="harita"?viewHarita() : tab==="zor"?viewZor() : viewAl();
  window.scrollTo({top:0,behavior:"instant"});
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.tab){tab=t.dataset.tab;quiz=null;render();return}
  if(t.dataset.f){fFilter=t.dataset.f;render();return}
  if(t.dataset.star){const id=t.dataset.star;star[id]=!star[id];if(!star[id])delete star[id];save();render();return}
  if(t.id==="os"){onlyStar=!onlyStar;render();return}
  if(t.dataset.n){N=+t.dataset.n;render();return}
  if(t.dataset.k){
    const q=build(t.dataset.k,N,onlyStar);
    if(!q){document.getElementById("view").insertAdjacentHTML("afterbegin",`<div class="empty">Bu seçimle soru üretilemedi — işaretli yapı sayısı çok az. Daha fazla yapı işaretle ya da filtreyi kaldır.</div>`);return}
    quiz=q;render();return}
  if(t.dataset.o!==undefined&&quiz&&quiz.sel===null){
    const q=quiz.qs[quiz.i]; quiz.sel=t.dataset.o;
    if(quiz.sel===q.ans)quiz.score++; else quiz.miss.push(q.g.id);
    render();return}
  if(t.id==="nq"){quiz.i++;quiz.sel=null;render();return}
  if(t.id==="again"||t.id==="quit"){quiz=null;render();return}
  if(t.id==="markmiss"){[...new Set(quiz.miss)].forEach(id=>star[id]=true);save();quiz=null;render();return}
});
render();
</script>

</body></html>
